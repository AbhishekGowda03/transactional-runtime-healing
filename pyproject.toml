[project]
name = "transactional-runtime-healing"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Abhishek Gowda", email = "abhishekgowdat05@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy==2.5.4",
    "pandas==3.0.6",
    "python-dateutil==2.9.0.post0",
    "six==1.17.0",
    "tzdata==2026.5 ; sys_platform == 'emscripten' or sys_platform == 'win32'",
]

[project.scripts]
transactional-runtime-healing = "transactional_runtime_healing:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
